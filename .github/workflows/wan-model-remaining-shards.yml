name: Wan2.2 Pinned Weight Shards -> RunPod S3 (no GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - '.github/workflows/wan-model-remaining-shards.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustfolio-wan-fullmodel-shards
  cancel-in-progress: false
jobs:
  pinned-weights:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        filename:
          - diffusion_pytorch_model-00001-of-00003.safetensors
          - diffusion_pytorch_model-00002-of-00003.safetensors
          - models_t5_umt5-xxl-enc-bf16.pth
          - diffusion_pytorch_model.safetensors.index.json
          - configuration.json
          - README.md
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU-only streaming deps
        run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3' 'huggingface_hub>=0.32,<2'
      - name: Upload SHA-pinned file and verify S3 remote read SHA256
        env:
          MODEL_FILE: ${{ matrix.filename }}
        run: python -m scripts.runpod_model_transfer --file "$MODEL_FILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan-remaining-shard-receipt-${{ strategy.job-index }}
          path: output/model-transfers/
          if-no-files-found: ignore
          retention-days: 30
