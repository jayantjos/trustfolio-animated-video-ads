name: Wan2.2 VAE 2.82GB -> RunPod verified transfer
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths: ['.github/workflows/wan-model-vae-upload.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustfolio-wan-vae-upload
  cancel-in-progress: false
jobs:
  vae:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3' 'huggingface_hub>=0.32,<2'
      - name: Transfer and SHA-256 verify locked VAE weight (no local 2.8GB file)
        run: python -m scripts.runpod_model_transfer --file Wan2.2_VAE.pth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan-vae-transfer-receipt
          path: output/model-transfers/
          if-no-files-found: ignore
          retention-days: 14
