name: TrustFolio RunPod GPU watchdog (READ ONLY)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/runpod_video_pod_watchdog.py'
      - 'tests/test_runpod_video_pod_watchdog.py'
      - '.github/workflows/runpod-video-pod-watchdog.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_runpod_video_pod_watchdog.py -v
      - run: python -m scripts.runpod_video_pod_watchdog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runpod-owned-pod-watchdog-audit
          path: output/runpod-video-gpu-watchdog.json
          retention-days: 7
          if-no-files-found: warn
