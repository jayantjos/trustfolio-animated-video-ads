# Live exact-pod observer during approved WAN9 private retry; volume always protected.
# Fresh reaper safety check before user-requested capped WAN9 private retry, 2026-10-24.
# Post-GPU-attempt read-only-or-cleanup confirmation, exact WAN9 owned pod only.
# WAN9 independent watch tick during one-time capped attempt; exact-name only.
# WAN9 one-time capped job preflight: fresh independently running protected reaper; preserve network volume.
name: TrustFolio WAN9 independent GPU Pod reaper (EXACT-owned Pod only)
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/wan9_independent_reaper.py'
      - 'tests/test_wan9_independent_reaper.py'
      - '.github/workflows/wan9-independent-pod-reaper.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustfolio-wan9-independent-reaper-global
  cancel-in-progress: false
jobs:
  reap-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUNPOD_POD_WRITE_KEY: ${{ secrets.RUNPOD_POD_WRITE_KEY }}
      TRUSTFOLIO_WAN9_REAPER_APPLY: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify independently-scoped reaper before any live operation
        run: python -m unittest discover -s tests -p 'test_wan9_independent_reaper.py' -v
      - name: Kill only WAN9 Pod on fatal or after 27 mins, preserve 100GB volume
        run: python -m scripts.wan9_independent_reaper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan9-independent-gpu-reaper-audit
          path: output/wan9-independent-reaper.json
          retention-days: 2
          if-no-files-found: warn
