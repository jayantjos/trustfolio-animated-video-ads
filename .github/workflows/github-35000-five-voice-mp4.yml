name: Green Boy product-first mobile review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/github-35000-five-voice-mp4.yml'
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: trustfolio-35000-complete-video-review
          path: checkpoint
          run-id: 41397080007
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: trustfolio-35000-corrected-video
          path: source
          run-id: 41678115525
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: trustfolio-35000-mobile
          path: mobile
          run-id: 41770643307
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: trustfolio-35000-greenboy-premium
          path: first-pass
          run-id: 41775015374
          github-token: ${{ github.token }}
      - name: Render using the approved Green Boy reference on CPU
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install -q chatterbox-tts Pillow
          ref=assets/video/washing-machines/original_greenboy_reference.wav
          if [ ! -s "$ref" ]; then git show "origin/main:$ref" > "$ref"; fi
          python final_master/scripts/greenboy_premium.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-35000-greenboy-premium
          path: |
            premium/TrustFolio_35000_GreenBoy_Premium.mp4
            premium/QA.json
            premium/mobile_*.png
            premium/greenboy_*.wav
          retention-days: 14
