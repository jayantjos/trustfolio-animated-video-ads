name: Mobile readability correction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/github-35000-five-voice-mp4.yml'
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trustfolio-35000-complete-video-review
          path: checkpoint
          run-id: 41397080007
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: trustfolio-35000-corrected-video
          path: source
          run-id: 41678115525
          github-token: ${{ github.token }}
      - name: Render visual overlays with original audio packets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core fonts-noto-core
          python -m pip install -q Pillow
          python final_master/scripts/mobile_readability.py source checkpoint mobile
      - uses: actions/upload-artifact@v4
        with:
          name: trustfolio-35000-mobile
          path: mobile/
          retention-days: 14
