name: First Wan2.2 5s video $1 approval preflight (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/first_wan5_gpu_preflight.py'
      - 'tests/test_first_wan5_gpu_preflight.py'
      - 'config/first_wan5_gpu_test.json'
      - '.github/workflows/first-wan5-gpu-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_WRITE_KEY: ${{ secrets.RUNPOD_POD_WRITE_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate scope and no-spend safety tests
        run: python -m unittest discover -s tests -p 'test_first_wan5_gpu_preflight.py' -v
      - name: GET RunPod GPU quote, verify existing S3 hero and check Pod secret only
        run: python -m scripts.first_wan5_gpu_preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-wan5-usd1-no-spend-preflight
          path: output/first-wan5-gpu-preflight.json
          retention-days: 14
          if-no-files-found: warn
