name: True 3D Tropical Scene STILL visual QA (quick)
on:
  push:
    branches: [feature/true-3d-cinematic-washing-pilot-20261019]
    paths: ['three_d/**', '.github/workflows/true-3d-still-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  quick-3d-still:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install real Blender CPU renderer
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender fonts-dejavu-core libegl1 libgl1-mesa-dri libosmesa6 libglvnd0
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Get exactly five original source-bound product photos
        run: |
          python premium/prepare.py --snapshot evidence/washing-machines-snapshot.json --output premium/public
      - name: Render one original 3D animation still (not fake parallax)
        run: |
          mkdir -p three_d/quick-output
          blender -b -t 2 --python three_d/tropical_laundry.py -- \
            --story premium/public/story.json --output three_d/quick-output \
            --frames 1 --resolution 90
      - name: Verify true Blender-rendered image and source safety
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,hashlib
          path=Path('three_d/quick-output/frame_0001.png')
          assert path.exists()
          im=Image.open(path)
          assert im.width>450 and im.height>800
          assert path.stat().st_size>20000
          story=json.loads(Path('premium/public/story.json').read_text())
          assert len(story['rankedProductIds'])==5
          assert story['publishing_enabled'] is False
          report={'status':'PRIVATE_TRUE_3D_STILL_CREATED','width':im.width,
                  'height':im.height,'source_ids':story['rankedProductIds'],
                  'source_sha256':story['sourceSha256'],
                  'image_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                  'historical_demo':True,'product_shape_is_illustrative':True,
                  'visual_human_review_approved':False,
                  'publishing_enabled':False}
          Path('three_d/quick-output/still-qa.json').write_text(json.dumps(report,indent=2))
          print('TRUE_3D_SINGLE_FRAME_QA_CREATED=true')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: true-3d-cinematic-washing-first-frame-private
          path: three_d/quick-output/
          retention-days: 15
          if-no-files-found: warn
