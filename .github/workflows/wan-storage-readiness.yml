name: Wan2.2 all 34.18GB files remote S3 HEAD audit (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'config/wan_verified_model_manifest.json'
      - 'scripts/wan_storage_readiness.py'
      - 'tests/test_wan_storage_readiness.py'
      - '.github/workflows/wan-storage-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install S3 client only
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Manifest and no-spend safety tests
        run: python -m unittest discover -s tests -p 'test_wan_storage_readiness.py' -v
      - name: Verify nine real remote S3 objects by HEAD
        run: python -m scripts.wan_storage_readiness
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wan-storage-34GB-audit
          path: output/wan-storage-ready.json
          retention-days: 30
