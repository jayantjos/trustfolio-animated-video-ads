name: TrustFolio ₹25000 product image alternatives source audit (one GET, CPU only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/website-image-alternatives-25000-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tf-website-image-alternatives-25000
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline image mapping and one-GET policy
        run: python -m unittest discover -s tests -p 'test_image_audit.py' -v
      - name: One read-only website Top 5 GET — no live-price refresh or app changes
        run: |
          python -m trustfolio_flow.image_audit --category washing-machines --budget 25000 \
            --output handoff/data/image_candidate_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-source-image-candidates-inr25000
          path: handoff/data/
          retention-days: 5
          if-no-files-found: warn
# No GPU, RunPod, media generation, POST /api/live-prices, or social publishing.
# Auto-push triggering must be removed after the initial audit finishes.
