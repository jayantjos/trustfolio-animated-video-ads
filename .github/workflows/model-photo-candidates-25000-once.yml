name: TrustFolio ₹25000 exact-model product photo candidates - one-time CPU
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get-model-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Download original third-party model-specific photo candidates for QA
        run: python -m trustfolio_flow.model_photo_candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-inr25000-ifb-bosch-photo-candidates
          path: handoff/candidate_photos/
          retention-days: 3
          if-no-files-found: warn
# Manual-only after successful initial run on 2026-10-27; no automatic repeated photo fetch.
# Photos are QA candidates, NOT automatic source-image replacement or live-price claim.
# No GPU, RunPod, social posting, TrustFolio app change, or live-price API POST.
