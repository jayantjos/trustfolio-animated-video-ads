name: Final Approved Assets - Inventory Only (NO PUBLISH)
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/video/washing-machines/**'
      - 'final_master/**'
      - '.github/workflows/final-master-assets-qa.yml'
permissions:
  contents: read
jobs:
  asset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify final uploaded ZIP assets; no old V6 dependencies
        run: python final_master/scripts/audit_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-master-source-audit
          path: handoff/final_source_audit.json
          retention-days: 7
# This workflow MUST NOT publish, synthesize voices, or claim live-product verification.
