name: Final Master - Live Readiness Diagnosis (NO POST)
on:
  workflow_dispatch:
    inputs:
      budget:
        description: INR budget
        default: '25000'
        required: true
      mode:
        description: Select campaign
        type: choice
        options: [budget, brand_budget]
        required: true
      brand:
        description: IFB for brand_budget
        default: ''
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate final approved master assets
        run: python final_master/scripts/audit_assets.py
      - name: Verify source product API and current price (fail closed)
        env:
          BUDGET: ${{ inputs.budget }}
          MODE: ${{ inputs.mode }}
          BRAND: ${{ inputs.brand }}
        run: |
          mkdir -p handoff
          python -m trustfolio_flow.cli fetch-live --category washing-machines --budget "$BUDGET" --mode "$MODE" --brand "$BRAND" --output handoff/live.json
      - name: Verify strict Top 5 contract
        run: |
          python final_master/scripts/campaign.py --receipt handoff/live.json --kit assets/video/washing-machines/TrustFolio_Washing_Machine_Master_Kit.zip --output handoff/campaign.json
      - name: Summarize missing photo approvals (never infer them)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('masters/washing-machines/approved_product_photos.json').read_text())
          approved=reg.get('approved_models',{})
          print('APPROVED_MODEL_COUNT='+str(sum(v.get('approved') is True for v in approved.values())))
          p=Path('handoff/live.json')
          if p.exists():
            receipt=json.loads(p.read_text())
            for item in receipt.get('products',[]):
              found=approved.get(item.get('id'),{})
              print(f"RANK_{item.get('rank')}_MODEL_PHOTO_APPROVED={found.get('approved') is True}")
          else: print('LIVE_RECEIPT_UNAVAILABLE: no product can be published')
          print('NO_PUBLISH_ATTEMPTED=YES')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-master-readiness-${{ github.run_id }}
          path: |
            handoff/final_source_audit.json
            handoff/live.json
            handoff/campaign.json
          retention-days: 3
          if-no-files-found: warn
# This is diagnostics only; no secrets or social actions.
