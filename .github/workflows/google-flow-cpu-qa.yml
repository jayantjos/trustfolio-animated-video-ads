name: Google Flow CPU Only Tests
on:
  pull_request:
    paths:
      - 'trustfolio_dynamic/**'
      - 'tests/test_dynamic_receipt.py'
      - 'demo/sample_receipt.json'
      - '.github/workflows/google-flow-cpu-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only runtime fonts and pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install pillow
      - name: Offline receipt validation unit tests
        run: python -m unittest discover -s tests -p test_dynamic_receipt.py -v
