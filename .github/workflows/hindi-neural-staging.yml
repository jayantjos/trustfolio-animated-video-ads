name: Hindi Neural Voice GPU-free pilot
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'config/hindi_neural_clips.json'
      - 'scripts/hindi_neural_staging.py'
      - '.github/workflows/hindi-neural-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU Hindi TTS
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pocket-tts @ git+https://github.com/kyutai-labs/pocket-tts@0c2db3b" "huggingface_hub>=0.32,<2" "boto3>=1.35,<2"
          command -v ffmpeg
      - name: Download Hindi neural model to temporary CPU workspace
        run: hf download Indus-Labs/indus-pocket-tts --local-dir output/indus-pocket-tts
      - name: Generate Hindi MP3 and stage into existing RunPod volume
        run: python -m scripts.hindi_neural_staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-hindi-female-neural-voice-private-qa
          path: output/hindi-neural-pilot/
          retention-days: 30
          if-no-files-found: warn
