name: WAN9 one-time under USD1 PRIVATE GPU technical motion (NO PUBLISH)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths: ['pilot/wan9-capped-once.request.json']
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: trustfolio-wan9-one-time-capped-20261024
  cancel-in-progress: false
jobs:
  wan9-real-technical-render:
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 31
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_WRITE_KEY: ${{ secrets.RUNPOD_POD_WRITE_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      GHCR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install existing private S3 client (no GPU yet)
        run: python -m pip install -q 'boto3>=1.35,<2'
      - name: Run no-GPU security tests and syntax validation
        run: |
          python -m py_compile scripts/wan9_capped_controller.py
          python -m unittest discover -s tests -p 'test_wan9_capped_controller.py' -v
          python -m unittest discover -s tests -p 'test_wan9_dollar1_budget.py' -v
          python -m unittest discover -s tests -p 'test_wan9_source_handoff.py' -v
          python -m unittest discover -s tests -p 'test_wan5_nine_scene_gpu_worker.py' -v
          python -m unittest discover -s tests -p 'test_final_motion_gate.py' -v
      - name: Verify exact pinned WAN9 worker image exists before GPU
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_PASS" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          docker manifest inspect ghcr.io/jayantjos/trustfolio-wan9-worker@sha256:0e7eb98f0db6a8163213f08804dd4b5f708d0670a458a9605bccc6815b7050eb >/dev/null
          docker logout ghcr.io >/dev/null
      - name: ONE paid capped GPU; stream log visibility; verify each scene; DELETE exact Pod
        run: python -m scripts.wan9_capped_controller
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan9-real-private-gpu-attempt-and-cleanup-receipt
          path: output/wan9-capped-first-attempt.json
          retention-days: 7
          if-no-files-found: warn
