name: TrustFolio washing final render readiness (NO GPU, NO POST)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/washing_final_readiness.py'
      - 'tests/test_washing_final_readiness.py'
      - '.github/workflows/washing-final-readiness.yml'
      - 'config/wan_verified_model_manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only S3 read-only dependencies
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Run fail-closed read-only readiness unit tests
        run: python -m unittest discover -s tests -p 'test_washing_final_readiness.py' -v
      - name: Audit exact Wan model, approved lady image, neural Hindi MP3s and scene art
        run: python -m scripts.washing_final_readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-washing-final-readiness
          path: output/washing-final-readiness.json
          if-no-files-found: warn
          retention-days: 30
