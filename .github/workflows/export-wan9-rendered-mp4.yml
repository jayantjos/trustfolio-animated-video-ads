name: Download actual 8 WAN9 rendered MP4s (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/export_wan9_rendered_clips.py'
      - '.github/workflows/export-wan9-rendered-mp4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-real-wan-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only RunPod S3 and ffmpeg tools
        run: |
          python -m pip install -q 'boto3>=1.35,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: SHA-check 8 actual GPU MP4s and export combined viewing copy
        run: python -m scripts.export_wan9_rendered_clips
      - name: Upload combined original-motion viewing MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrustFolio-WAN2-Real-Rendered-8-Scenes-MP4
          path: |
            output/wan9-render-export/TrustFolio-WAN2.2-Rendered-8-Scenes-SILENT.mp4
            output/wan9-render-export/provenance.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload 8 original model-rendered MP4 files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrustFolio-WAN2-8-Original-Clips
          path: output/wan9-render-export/clips/*.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
