name: TrustFolio CPU Washing Scene8 Compositor Guard
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_washing_scene08_cpu_preview.py'
      - '.github/workflows/scene08-preview-ci.yml'
  pull_request:
    paths:
      - 'scripts/render_washing_scene08_cpu_preview.py'
      - '.github/workflows/scene08-preview-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline CPU preview dependencies
        run: python -m pip install 'Pillow>=10,<13' 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5'
      - name: Verify compositor syntax
        run: python -m py_compile scripts/render_washing_scene08_cpu_preview.py
      - name: Test source cross-brand photo and unverified price guards (no network)
        run: |
          python - <<'PY'
          import importlib.util,json,tempfile
          from pathlib import Path
          from trustfolio_flow.live import campaign,sha
          spec=importlib.util.spec_from_file_location("preview","scripts/render_washing_scene08_cpu_preview.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          source=Path("assets/video/washing-machines/trustfolio_washing_40s_visual_master_v1.mp4")
          assert source.is_file()
          assert module.EXPECTED_SHA256=="2d58880dc27c04c245ff95a10b53ba009538badd04f314062275149c9b5bb48c"
          s=campaign("washing-machines",25000)
          products=[]
          for i in range(1,6):
              products.append(dict(rank=i,id=f"{i:024x}",brand=["IFB","IFB","Bosch","IFB","Samsung"][i-1],
                price_inr=str(21000+i),image_url=("https://sample.test/a.jpg" if i in (1,3) else f"https://sample.test/{i}.jpg")))
          receipt=dict(source="trustfolio_website_display",publishable=False,pricing_verification="WEBSITE_LISTED_ONLY",
                       category="washing-machines",budget_inr=25000,mode="budget",brand="",products=products)
          receipt["snapshot_sha256"]=sha({"spec":s,"products":products})
          with tempfile.TemporaryDirectory() as td:
              for i in range(1,6):Path(td,f"rank_{i:02d}.png").touch()
              try:module.verify(source,receipt,td,False)
              except ValueError as e:assert "CROSS_BRAND_PHOTO_BLOCKED" in str(e)
              else:raise AssertionError("Wrong shared IFB/Bosch photo not blocked")
              assert module.verify(source,receipt,td,True)==[[1,3]]
              bad=json.loads(json.dumps(receipt));bad["products"][0]["price_inr"]="29999"
              try:module.verify(source,bad,td,True)
              except ValueError:pass
              else:raise AssertionError("Modified price not blocked")
          print("CPU_STAGE8_GUARDS=PASS; MASTER_HASH=PASS; LIVE_PRICE_CERTIFICATION=NO; AUTO_PUBLISH=NO")
          PY
# No GPU, no external API calls, no RunPod, no social posting, no video generation.
