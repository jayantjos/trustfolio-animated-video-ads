name: Final Master Contract QA (assets only, no post)
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/video/washing-machines/**'
      - 'final_master/**'
      - '.github/workflows/final-master-contract-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check approved asset archives
        run: python final_master/scripts/audit_assets.py
      - name: Check strict live-data contract with positive and negative samples
        run: |
          python -m py_compile final_master/scripts/dialogues.py
          python -m unittest discover -s final_master/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: final-master-qa-evidence
          path: handoff/final_source_audit.json
          retention-days: 7
# Never enable publishing from this QA pipeline.
