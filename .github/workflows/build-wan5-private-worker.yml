name: Build pinned Wan2.2 GPU worker OCI image (NO GPU POD)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'gpu/Dockerfile.wan5'
      - 'gpu/.dockerignore'
      - 'scripts/wan5_gpu_worker.py'
      - 'tests/test_wan5_gpu_worker.py'
      - '.github/workflows/build-wan5-private-worker.yml'
  pull_request:
    branches: [feat/animated-engine-foundation]
    paths:
      - 'gpu/Dockerfile.wan5'
      - 'gpu/.dockerignore'
      - 'scripts/wan5_gpu_worker.py'
      - 'tests/test_wan5_gpu_worker.py'
      - '.github/workflows/build-wan5-private-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: trustfolio-first-wan5-worker-oci-build
  cancel-in-progress: false
jobs:
  build-image:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/washing-machine-character-video-pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: CPU safety tests before any OCI publish
        run: python -m unittest discover -s tests -p 'test_wan5_gpu_worker.py' -v
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable candidate (no paid GPU inference)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gpu/Dockerfile.wan5
          push: true
          tags: ghcr.io/jayantjos/trustfolio-wan5-worker:pilot-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jayantjos/trustfolio-animated-video-ads
            trustfolio.publishing_enabled=false
      - name: Record candidate digest; never call it GPU-tested
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,re
          d=os.environ["DIGEST"]
          assert re.fullmatch("sha256:[0-9a-f]{64}",d), "NO_IMMUTABLE_IMAGE_DIGEST"
          image="ghcr.io/jayantjos/trustfolio-wan5-worker@"+d
          out={"status":"OCI_BUILT_PUBLISHED_GPU_UNTESTED",
               "image":image,"git_sha":os.environ["SOURCE_SHA"],
               "private_registry_pull_access_not_verified":True,
               "real_gpu_inference_completed":False,
               "provider_terminate_after_not_verified":True,
               "billable_pods_created":False,"publishing_enabled":False}
          os.makedirs("output",exist_ok=True)
          with open("output/wan5-worker-image-receipt.json","w") as f:
              json.dump(out,f,indent=2)
          print("WAN5_GPU_WORKER_IMAGE="+image)
          print("WAN5_GPU_IMAGE_STATUS=OCI_PUBLISHED_NOT_GPU_TESTED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan5-pinned-oci-worker-candidate-receipt
          path: output/wan5-worker-image-receipt.json
          retention-days: 30
          if-no-files-found: warn
