name: Collect genuine WAN5 5s MP4 from RunPod after private pilot
on:
  workflow_run:
    workflows: ['RUN FIRST APPROVED WAN5 REAL 5-SECOND GPU PILOT (MAX $1 GPU)']
    types: [completed]
permissions:
  contents: read
jobs:
  verify-and-package:
    if: github.event.workflow_run.head_repository.full_name == 'jayantjos/trustfolio-animated-video-ads' && github.event.workflow_run.head_branch == 'feat/washing-machine-character-video-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Check original GPU Pod is gone before packaging video
        run: |
          python - <<'PY'
          import os,json,urllib.request
          key=os.environ['RUNPOD_API_KEY']
          q=urllib.request.Request('https://api.runpod.io/v2/pods',method='GET',
                 headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
          with urllib.request.urlopen(q,timeout=30) as resp:
              pods=json.load(resp).get('pods',[])
          assert isinstance(pods,list),'LIST_PODS_FAILED'
          matches=[p for p in pods if p.get('name')=='trustfolio-video-wan5-laundry-first-20261021']
          assert len(matches)==0, 'GPU_STILL_EXISTS_BLOCK_DOWNLOAD_UNTIL_DESTROYED'
          print('WAN5_GPU_POD_DESTROYED=CONFIRMED')
          PY
      - name: Download exact S3 original render and independently validate length SHA256 frame duration
        id: video
        run: |
          python - <<'PY'
          import os,json,hashlib,pathlib,subprocess
          import boto3
          from botocore.config import Config
          key='videos/private-qa/wan5-laundry-first-20261021/'
          s3=boto3.client('s3',region_name='eu-ro-1',endpoint_url='https://s3api-eu-ro-1.runpod.io',
                aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
                aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
                config=Config(signature_version='s3v4',s3={'addressing_style':'path'}))
          try:
              obj=s3.get_object(Bucket='1bch597yrz',Key=key+'scene01.receipt.json')
          except Exception:
              print('WAN5_VIDEO_ARTIFACT=NO_VERIFIED_RECEIPT_FROM_GPU')
              raise SystemExit(2)
          report=json.loads(obj['Body'].read(65536))
          obj['Body'].close()
          assert report.get('status')=='VOLUME_MP4_WRITTEN_PENDING_S3_GET_VERIFICATION'
          assert report.get('job_id')=='wan5-laundry-first-20261021'
          assert report.get('character_sha256')=='7f9ca4e47803ff9df57ff389ede1bba15eb6cb761c2fe4521edfe4036bc20ac6'
          assert report.get('s3_key')==key+'scene01.mp4'
          assert report.get('social_publishing') is False
          size=report.get('bytes')
          assert isinstance(size,int) and 10000<size<200000000
          out=pathlib.Path('output/wan5-first-5sec')
          out.mkdir(parents=True,exist_ok=True)
          mp4=out/'wan5-first-5sec.mp4'
          s3.download_file('1bch597yrz',key+'scene01.mp4',str(mp4))
          sha=hashlib.file_digest(mp4.open('rb'),'sha256').hexdigest()
          assert mp4.stat().st_size==size and sha==report['sha256'],'MP4_S3_SHA_OR_LENGTH_MISMATCH'
          p=subprocess.run(['ffprobe','-v','error','-show_streams','-show_format',
             '-of','json',str(mp4)],capture_output=True,text=True,check=True,timeout=45)
          meta=json.loads(p.stdout)
          streams=[x for x in meta.get('streams',[]) if x.get('codec_type')=='video']
          assert len(streams)>=1 and int(streams[0]['height'])>int(streams[0]['width']),'NOT_VERTICAL_VIDEO'
          seconds=float(meta['format']['duration'])
          assert 4.8<=seconds<=5.3,'VIDEO_NOT_5_SECONDS'
          (out/'wan5-first-5sec.receipt.json').write_text(json.dumps({
              'verified_mp4_sha256':sha,'bytes':size,'seconds':seconds,
              'source_job_id':report['job_id'],'gpu_pod_deleted':True,
              'published_to_social':False,'model':'Wan2.2-TI2V-5B'
          },indent=2)+'\n')
          print('WAN5_VERIFIED_VIDEO_MP4_READY=true')
          print('WAN5_MP4_SHA256='+sha)
          PY
      - name: Make real MP4 downloadable as private GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: trustfolio-first-real-wan5-5sec-video
          path: output/wan5-first-5sec/
          retention-days: 30
          if-no-files-found: error
