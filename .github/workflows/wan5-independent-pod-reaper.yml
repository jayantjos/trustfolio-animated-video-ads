name: TrustFolio WAN5 independent stale Pod reaper (FIRST PILOT ONLY)
# Fifth pilot readiness: independent error/age reaper must be recently healthy.
# Public-repository no-GPU API readiness rerun, 2026-10-23; ownership checks unchanged.
# In-flight Pod health guard for approved capped run 39845616705; do not touch network volume.
# Fresh owner-approved $1 capped pilot readiness check for 23 Oct; preserve volume.
# CPU-only readiness audit for next explicit private GPU pilot at 2026-10-23T01:42:19.674Z; ownership rules unchanged.
# Updated GPU preflight health at 2026-10-22T22:03:26.811Z; no RunPod config/policy changed.
# Fresh independent $1 cap third GPU preflight audit 2026-10-22T23:23:25.682Z; policy unchanged.
# Refresh scheduled-reaper health for owner-approved Wan5 follow-up: 2026-10-23 11:36 UTC (no policy change).
# Fresh independent safety-reaper verification for approved retry at 2026-10-23T13:53:29.784Z; volume preserved.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/wan5_independent_reaper.py'
      - 'scripts/wan5_live_log_guard.py'
      - 'tests/test_wan5_independent_reaper.py'
      - '.github/workflows/wan5-independent-pod-reaper.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustfolio-wan5-independent-reaper
  cancel-in-progress: false
jobs:
  safe-reap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_POD_WRITE_KEY: ${{ secrets.RUNPOD_POD_WRITE_KEY }}
      TRUSTFOLIO_WAN5_REAPER_APPLY: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Strict ownership and stale-age safety tests
        run: |
          python -m unittest discover -s tests -p 'test_wan5_independent_reaper.py' -v
          python -m unittest discover -s tests -p 'test_wan5_live_log_guard.py' -v
      - name: Stop ONLY fatal-log or stale exact-owned WAN5 pilot Pod; preserve network volume
        run: python -m scripts.wan5_independent_reaper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-wan5-independent-reaper-audit
          path: output/wan5-independent-reaper.json
          retention-days: 7
          if-no-files-found: warn
