name: TrustFolio WAN5 independent stale Pod reaper (FIRST PILOT ONLY)
# Fifth pilot readiness: independent error/age reaper must be recently healthy.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/wan5_independent_reaper.py'
      - 'scripts/wan5_live_log_guard.py'
      - 'tests/test_wan5_independent_reaper.py'
      - '.github/workflows/wan5-independent-pod-reaper.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustfolio-wan5-independent-reaper
  cancel-in-progress: false
jobs:
  safe-reap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_POD_WRITE_KEY: ${{ secrets.RUNPOD_POD_WRITE_KEY }}
      TRUSTFOLIO_WAN5_REAPER_APPLY: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Strict ownership and stale-age safety tests
        run: |
          python -m unittest discover -s tests -p 'test_wan5_independent_reaper.py' -v
          python -m unittest discover -s tests -p 'test_wan5_live_log_guard.py' -v
      - name: Stop ONLY fatal-log or stale exact-owned WAN5 pilot Pod; preserve network volume
        run: python -m scripts.wan5_independent_reaper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustfolio-wan5-independent-reaper-audit
          path: output/wan5-independent-reaper.json
          retention-days: 7
          if-no-files-found: warn
