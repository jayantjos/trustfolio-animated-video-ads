name: V10 stable specs and fixed Hindi narrator model - offline QA
on:
  pull_request:
    paths:
      - 'trustfolio_flow/v10_fixed_voice.py'
      - 'trustfolio_flow/v10_stable_specs.py'
      - 'trustfolio_flow/v10_voice_audition.py'
      - 'tests/test_v10_stable_voice.py'
      - 'masters/washing-machines/v10_voice_profile.json'
      - '.github/workflows/v10-stable-specs-voice-ci.yml'
  push:
    branches: [main]
    paths:
      - 'trustfolio_flow/v10_fixed_voice.py'
      - 'trustfolio_flow/v10_stable_specs.py'
      - 'trustfolio_flow/v10_voice_audition.py'
      - 'tests/test_v10_stable_voice.py'
      - 'masters/washing-machines/v10_voice_profile.json'
      - '.github/workflows/v10-stable-specs-voice-ci.yml'
permissions:
  contents: read
jobs:
  zero-network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Validate no spec jitter, exact voice ID, no unsupported reasons, credit switch OFF
        run: python -m unittest discover -s tests -p 'test_v10_stable_voice.py' -v
# Pure local tests; no TTS request, no Meta, no GPU, no live prices.
