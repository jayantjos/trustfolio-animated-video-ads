name: Static and contract QA
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: animated-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'numpy==2.2.6' 'boto3>=1.35,<2' 'requests>=2.32,<3' 'huggingface_hub>=0.32,<2'
      - run: python -m compileall -q trustfolio_video tests
      - run: python -m unittest discover -s tests -v
