name: WAN5 full storage, pricing and watchdog prelaunch check (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths: ['.github/workflows/wan5-prelaunch-readonly-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  no-spend-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_WRITE_KEY: ${{ secrets.RUNPOD_POD_WRITE_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU-only read-only S3 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify failure detection, exact-pod ownership and approved GPU worker
        run: |
          python -m unittest discover -s tests -p 'test_wan5_first_paid_controller.py' -v
          python -m unittest discover -s tests -p 'test_wan5_live_log_guard.py' -v
          python -m unittest discover -s tests -p 'test_wan5_gpu_worker.py' -v
          python -m unittest discover -s tests -p 'test_wan_storage_readiness.py' -v
          python -m unittest discover -s tests -p 'test_first_wan5_gpu_preflight.py' -v
      - name: Audit nine remote checkpoint objects by S3 HEAD (NO GPU)
        run: python -m scripts.wan_storage_readiness
      - name: Audit RunPod owned Pods, live RTX4090 price, 100GB volume and original PNG SHA
        run: python -m scripts.first_wan5_gpu_preflight
      - name: Confirm approved character file unchanged
        run: python -c 'from scripts.stage_canonical_character import hash_image; assert hash_image()=="7f9ca4e47803ff9df57ff389ede1bba15eb6cb761c2fe4521edfe4036bc20ac6"'
      - name: Record READ-ONLY preflight status, NEVER create a GPU Pod
        if: success()
        run: |
          echo 'WAN5_PRELAUNCH_CHECKS=COMPLETED_READ_ONLY'
          echo 'WAN5_BILLABLE_GPU_PODS_CREATED=false'
          echo 'WAN5_GPU_RENDER_NOT_TESTED=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan5-prelaunch-readonly-storage-gpu-guard-audit
          path: |
            output/wan-storage-ready.json
            output/first-wan5-gpu-preflight.json
          retention-days: 14
          if-no-files-found: warn
