name: WAN5 first GPU Pod live status & MP4 receipt (READ ONLY)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths: ['.github/workflows/wan5-live-first-pod-monitor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read owned Pod running status and exact video receipt, no mutations
        run: |
          python - <<'PY'
          import os,json,urllib.request
          k=os.environ['RUNPOD_API_KEY']
          q=urllib.request.Request('https://api.runpod.io/v2/pods',method='GET',
               headers={'Authorization':'Bearer '+k,'Accept':'application/json'})
          with urllib.request.urlopen(q,timeout=30) as resp:
              pods=json.load(resp).get('pods',[])
          owned=[p for p in pods if p.get('name')=='trustfolio-video-wan5-laundry-first-20261021']
          print('PILOT_OWNED_GPU_POD_COUNT='+str(len(owned)))
          for p in owned:
              print('PILOT_POD_ID='+str(p.get('id','')))
              print('PILOT_POD_STATUS='+str(p.get('status','')))
              print('PILOT_POD_REGION='+str(p.get('dataCenterId','')))
              print('PILOT_POD_GPU='+str(p.get('gpu',{}).get('id','') if isinstance(p.get('gpu'),dict) else 'unknown'))
              print('PILOT_POD_CREATED_AT='+str(p.get('createdAt','')))
          import boto3
          from botocore.config import Config
          s=boto3.client('s3',region_name='eu-ro-1',endpoint_url='https://s3api-eu-ro-1.runpod.io',
             aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
             aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
             config=Config(signature_version='s3v4',s3={'addressing_style':'path'}))
          key='videos/private-qa/wan5-laundry-first-20261021/scene01.receipt.json'
          try:
              data=s.get_object(Bucket='1bch597yrz',Key=key)
              b=data['Body'].read(65536)
              data['Body'].close()
              receipt=json.loads(b)
              print('PILOT_GPU_MP4_RECEIPT_STATUS='+str(receipt.get('status')))
              print('PILOT_GPU_MP4_RECEIPT_BYTES='+str(receipt.get('bytes')))
              print('PILOT_GPU_MP4_RECEIPT_DURATION='+str(receipt.get('seconds')))
          except Exception:
              print('PILOT_GPU_MP4_RECEIPT=NOT_YET_VERIFIED')
          print('READ_ONLY_NO_POD_CREATED_OR_DELETED=true')
          PY
