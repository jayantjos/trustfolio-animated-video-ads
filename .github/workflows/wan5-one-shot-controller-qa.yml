name: WAN5 single paid-test controller safety QA (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/wan5_first_paid_controller.py'
      - 'tests/test_wan5_first_paid_controller.py'
      - 'scripts/wan5_live_log_guard.py'
      - 'tests/test_wan5_live_log_guard.py'
      - '.github/workflows/wan5-one-shot-controller-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Strict paid-pod ownership, budget, TTL, media SHA and duplicate-guard unit tests
        run: |
          python -m unittest discover -s tests -p 'test_wan5_first_paid_controller.py' -v
          python -m unittest discover -s tests -p 'test_wan5_live_log_guard.py' -v
      - name: Original image remains pinned exactly
        run: python -c 'from scripts.stage_canonical_character import hash_image; assert hash_image()=="7f9ca4e47803ff9df57ff389ede1bba15eb6cb761c2fe4521edfe4036bc20ac6"'
      - name: Confirm unit workflow does NOT receive any billable API credentials
        run: echo 'NO_GPU_CREATED=true'
