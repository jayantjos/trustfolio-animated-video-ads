name: RunPod existing volume and S3 read-only verification
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/runpod_existing_volume.py'
      - 'scripts/runpod_s3_smoke.py'
      - 'config/runpod_existing_volume.json'
      - 'tests/test_runpod_existing_volume.py'
      - '.github/workflows/runpod-existing-volume-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU safety unit tests
        run: python -m unittest discover -s tests -p test_runpod_existing_volume.py -v
      - name: Verify exact existing RunPod network volume using GET
        run: python -m scripts.runpod_existing_volume
      - name: Install boto3 for S3 API verification
        run: python -m pip install "boto3>=1.35,<2"
      - name: Check S3 read access only (if separate S3 credentials exist)
        run: python -m scripts.runpod_s3_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: runpod-existing-volume-verified
          path: output/existing-volume-verified.json
          retention-days: 7
          if-no-files-found: error
