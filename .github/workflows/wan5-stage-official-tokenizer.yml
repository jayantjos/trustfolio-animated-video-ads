name: WAN5 official tokenizer revision S3 staging (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths:
      - 'scripts/stage_wan5_tokenizer.py'
      - 'tests/test_stage_wan5_tokenizer.py'
      - '.github/workflows/wan5-stage-official-tokenizer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-tokenizer-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install S3 client only (never launch Pod)
        run: python -m pip install 'boto3>=1.35,<2'
      - name: No GPU safety tests for strict official tokenizer files
        run: python -m unittest discover -s tests -p 'test_stage_wan5_tokenizer.py' -v
      - name: Fetch official pinned tokenizer and independently verify S3 readback
        run: python -m scripts.stage_wan5_tokenizer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan5-official-tokenizer-four-files-stage-receipt
          path: output/wan5-tokenizer-stage-receipt.json
          retention-days: 30
          if-no-files-found: warn
