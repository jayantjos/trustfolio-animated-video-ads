name: WAN5 GHCR private OCI authenticated Docker check (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths: ['.github/workflows/wan5-ghcr-credential-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  private-oci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check exact SHA256 image manifest without downloading image layers
        shell: bash
        run: |
          if docker manifest inspect ghcr.io/jayantjos/trustfolio-wan5-worker@sha256:5f920321ce5cd6485e560a670b3b53f8f69cc07b2b71b10caa28723eea15cdf1 >/dev/null; then
            echo "GHCR_DOCKER_MANIFEST=PULL_ACCESS_OK"
          else
            echo "GHCR_DOCKER_MANIFEST=BLOCKED_PRIVATE_PACKAGE"
            exit 3
          fi
          echo "PAID_GPU_CREATED=false"
