name: WAN5 GHCR short-lived GITHUB_TOKEN authorized manifest preflight (NO GPU)
on:
  push:
    branches: [feat/washing-machine-character-video-pilot]
    paths: ['.github/workflows/wan5-ghcr-credential-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  private-oci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Check precise worker OCI SHA via short-lived Actions token
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error,base64
          user=os.environ["ACTOR"]
          password=os.environ["GITHUB_ACCESS_TOKEN"]
          url="https://ghcr.io/token?service=ghcr.io&scope=repository%3Ajayantjos%2Ftrustfolio-wan5-worker%3Apull"
          auth=base64.b64encode((user+":"+password).encode()).decode()
          req=urllib.request.Request(url,headers={"Authorization":"Basic "+auth})
          try:
              with urllib.request.urlopen(req,timeout=20) as f:
                  token=json.load(f).get("token","")
              if not token: raise RuntimeError("EMPTY_GHCR_BEARER_TOKEN")
              digest="sha256:5f920321ce5cd6485e560a670b3b53f8f69cc07b2b71b10caa28723eea15cdf1"
              u="https://ghcr.io/v2/jayantjos/trustfolio-wan5-worker/manifests/"+digest
              req=urllib.request.Request(u,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"},method="GET")
              with urllib.request.urlopen(req,timeout=20) as f:
                  if f.status!=200: raise RuntimeError("OCI_MANIFEST_NOT_200")
                  if not f.read(20000): raise RuntimeError("EMPTY_IMAGE_MANIFEST")
              print("GHCR_PRIVATE_WORKER_AUTH=PULL_VERIFIED")
              print("RUNPOD_CREATE_NOT_ATTEMPTED")
          except urllib.error.HTTPError as e:
              print("GHCR_PRIVATE_WORKER_AUTH=HTTP_"+str(e.code))
              raise SystemExit(2)
          except Exception as e:
              print("GHCR_PRIVATE_WORKER_AUTH=FAILED_"+type(e).__name__)
              raise SystemExit(3)
          PY
